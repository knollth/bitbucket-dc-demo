services:
  bitbucket:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_OPTS: -Dfile.encoding=UTF-8 -Duser.timezone=UTC
      JDBC_DRIVER: org.postgresql.Driver
      JDBC_PASSWORD: >-
        ${BITBUCKET_DB_PASSWORD:?Set BITBUCKET_DB_PASSWORD in .env}
      JDBC_URL: >-
        jdbc:postgresql://postgres:5432/${BITBUCKET_DB_NAME:-bitbucket}
      JDBC_USER: ${BITBUCKET_DB_USER:-bitbucket}
      SETUP_BASEURL: ${BITBUCKET_BASE_URL:-http://localhost:7990}
      SETUP_DISPLAYNAME: ${BITBUCKET_DISPLAY_NAME:-Bitbucket}
      SETUP_LICENSE: >-
        ${BITBUCKET_LICENSE:?Set BITBUCKET_LICENSE in .env}
      SETUP_SYSADMIN_PASSWORD: >-
        ${BITBUCKET_ADMIN_PASSWORD:?Set BITBUCKET_ADMIN_PASSWORD in .env}
      SETUP_SYSADMIN_USERNAME: ${BITBUCKET_ADMIN_USERNAME:-admin}
      SETUP_SYSADMIN_DISPLAYNAME: >-
        ${BITBUCKET_ADMIN_DISPLAY_NAME:-Administrator}
      SETUP_SYSADMIN_EMAILADDRESS: >-
        ${BITBUCKET_ADMIN_EMAIL:?Set BITBUCKET_ADMIN_EMAIL in .env}
    healthcheck:
      interval: 30s
      retries: 10
      start_period: 120s
      test: [ CMD-SHELL, curl --fail --silent --show-error http://127.0.0.1:7990/ >/dev/null ]
      timeout: 10s
    image: ${BITBUCKET_IMAGE:-atlassian/bitbucket:9.6.4}
    deploy:
      ressources:
        limits:
          memory: 4g
    ports:
    - 127.0.0.1:${BITBUCKET_HTTP_PORT:-7990}:7990
    - 127.0.0.1:${BITBUCKET_SSH_PORT:-7999}:7999
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - bitbucket-data:/var/atlassian/application-data/bitbucket

  postgres:
    environment:
      POSTGRES_DB: ${BITBUCKET_DB_NAME:-bitbucket}
      POSTGRES_PASSWORD: >-
        ${BITBUCKET_DB_PASSWORD:?Set BITBUCKET_DB_PASSWORD in .env}
      POSTGRES_USER: ${BITBUCKET_DB_USER:-bitbucket}
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 10s
      test: [ CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" ]
      timeout: 5s
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - postgres-data:/var/lib/postgresql/data

volumes:
  bitbucket-data:
  postgres-data:
